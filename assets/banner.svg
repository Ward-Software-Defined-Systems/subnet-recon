<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00bcd4"/>
      <stop offset="100%" style="stop-color:#26c6da"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00bcd4;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00bcd4;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="280" rx="12" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="278" rx="11" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Grid pattern (subtle network feel) -->
  <g opacity="0.06" stroke="#00bcd4" stroke-width="0.5">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="280"/>
    <line x1="160" y1="0" x2="160" y2="280"/>
    <line x1="240" y1="0" x2="240" y2="280"/>
    <line x1="320" y1="0" x2="320" y2="280"/>
    <line x1="400" y1="0" x2="400" y2="280"/>
    <line x1="480" y1="0" x2="480" y2="280"/>
    <line x1="560" y1="0" x2="560" y2="280"/>
    <line x1="640" y1="0" x2="640" y2="280"/>
    <line x1="720" y1="0" x2="720" y2="280"/>
  </g>

  <!-- Network nodes and connections -->
  <g opacity="0.15">
    <!-- Connection lines -->
    <line x1="100" y1="70" x2="180" y2="110" stroke="#00bcd4" stroke-width="1"/>
    <line x1="180" y1="110" x2="140" y2="170" stroke="#00bcd4" stroke-width="1"/>
    <line x1="180" y1="110" x2="260" y2="90" stroke="#00bcd4" stroke-width="1"/>
    <line x1="140" y1="170" x2="80" y2="200" stroke="#00bcd4" stroke-width="1"/>
    <line x1="140" y1="170" x2="220" y2="210" stroke="#00bcd4" stroke-width="1"/>
    <line x1="260" y1="90" x2="220" y2="210" stroke="#00bcd4" stroke-width="1"/>

    <line x1="600" y1="60" x2="680" y2="100" stroke="#00bcd4" stroke-width="1"/>
    <line x1="680" y1="100" x2="720" y2="170" stroke="#00bcd4" stroke-width="1"/>
    <line x1="680" y1="100" x2="620" y2="150" stroke="#00bcd4" stroke-width="1"/>
    <line x1="620" y1="150" x2="660" y2="220" stroke="#00bcd4" stroke-width="1"/>
    <line x1="720" y1="170" x2="660" y2="220" stroke="#00bcd4" stroke-width="1"/>
    <line x1="720" y1="170" x2="750" y2="230" stroke="#00bcd4" stroke-width="1"/>
  </g>

  <!-- Network nodes -->
  <g opacity="0.25">
    <circle cx="100" cy="70" r="3" fill="#00bcd4"/>
    <circle cx="180" cy="110" r="4" fill="#00bcd4"/>
    <circle cx="140" cy="170" r="3" fill="#00bcd4"/>
    <circle cx="260" cy="90" r="3" fill="#00bcd4"/>
    <circle cx="80" cy="200" r="2.5" fill="#00bcd4"/>
    <circle cx="220" cy="210" r="3" fill="#00bcd4"/>

    <circle cx="600" cy="60" r="3" fill="#00bcd4"/>
    <circle cx="680" cy="100" r="4" fill="#00bcd4"/>
    <circle cx="720" cy="170" r="3" fill="#00bcd4"/>
    <circle cx="620" cy="150" r="3" fill="#00bcd4"/>
    <circle cx="660" cy="220" r="2.5" fill="#00bcd4"/>
    <circle cx="750" cy="230" r="3" fill="#00bcd4"/>
  </g>

  <!-- Scanning pulse rings (left cluster) -->
  <circle cx="180" cy="110" r="12" fill="none" stroke="#00bcd4" stroke-width="0.8" opacity="0.2"/>
  <circle cx="180" cy="110" r="22" fill="none" stroke="#00bcd4" stroke-width="0.5" opacity="0.1"/>

  <!-- Scanning pulse rings (right cluster) -->
  <circle cx="680" cy="100" r="12" fill="none" stroke="#00bcd4" stroke-width="0.8" opacity="0.2"/>
  <circle cx="680" cy="100" r="22" fill="none" stroke="#00bcd4" stroke-width="0.5" opacity="0.1"/>

  <!-- Radar/scan icon -->
  <g transform="translate(400, 95)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#00bcd4" stroke-width="1.5" opacity="0.3"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#00bcd4" stroke-width="1" opacity="0.2"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#00bcd4" stroke-width="1" opacity="0.15"/>
    <circle cx="0" cy="0" r="3" fill="#00bcd4" opacity="0.6"/>
    <!-- Sweep line -->
    <line x1="0" y1="0" x2="22" y2="-22" stroke="#00bcd4" stroke-width="1.5" opacity="0.5"/>
    <!-- Detected dots -->
    <circle cx="10" cy="-8" r="2" fill="#4dd0e1" opacity="0.7"/>
    <circle cx="-15" cy="12" r="2" fill="#4dd0e1" opacity="0.5"/>
    <circle cx="20" cy="5" r="2" fill="#4dd0e1" opacity="0.6"/>
  </g>

  <!-- Title -->
  <text x="400" y="172" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="42" font-weight="700" fill="url(#accent)" letter-spacing="2">subnet-recon</text>

  <!-- Subtitle -->
  <text x="400" y="200" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="14" fill="#8b949e" letter-spacing="1">Parallel network subnet scanner</text>

  <!-- Tag pills -->
  <g transform="translate(400, 230)">
    <!-- Rust pill -->
    <rect x="-180" y="-12" width="62" height="24" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="-149" y="4" text-anchor="middle" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#f97583">Rust</text>

    <!-- ICMP pill -->
    <rect x="-100" y="-12" width="68" height="24" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="-66" y="4" text-anchor="middle" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#79c0ff">ICMP</text>

    <!-- TCP pill -->
    <rect x="-16" y="-12" width="58" height="24" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="13" y="4" text-anchor="middle" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#79c0ff">TCP</text>

    <!-- Parallel pill -->
    <rect x="58" y="-12" width="82" height="24" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="99" y="4" text-anchor="middle" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#56d364">Parallel</text>

    <!-- CLI pill -->
    <rect x="156" y="-12" width="52" height="24" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="182" y="4" text-anchor="middle" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#d2a8ff">CLI</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="200" y="262" width="400" height="2" rx="1" fill="url(#accent)" opacity="0.3"/>
</svg>
