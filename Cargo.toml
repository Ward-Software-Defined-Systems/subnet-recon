[package]
name = "subnet-recon"
version = "0.1.0"
edition = "2021"

[dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
rand = "0.8"
socket2 = { version = "0.5", features = ["all"] }
indicatif = "0.17"
clap = { version = "4", features = ["derive"] }
ipnet = "2"
thiserror = "2"
num_cpus = "1.16"
parking_lot = "0.12"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
